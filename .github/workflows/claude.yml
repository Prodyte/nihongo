name: Claude on PR comments
# Mention @claude in a PR comment, a line comment, or a submitted review: the agents address it and push to the PR.
# Comments without @claude are ignored. The action only acts for commenters with write access.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # ponytail: installs main's deps; a PR that changes package.json needs its own npm ci first
      - uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1" # headless runs exit when the turn ends, killing background subagents
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true # print each agent's work in the run log; the repo is public, so is the log
          claude_args: >-
            --max-turns 60
            --allowedTools "Edit,Write,Bash(npm test:*),Bash(npm run lint:*),Bash(npm run build:*),Bash(npx tsc:*),Bash(npx vitest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*)"
            --append-system-prompt "You are addressing review comments on a pull request. Make code changes only through
            the dev agent, then run the reviewer and qa agents in parallel; if either reports a problem, send it back to dev
            (max 2 rounds). Run agents in the foreground. Commit in this repo's style: plain sentences, no feat: prefix.
            If a comment is ambiguous, change nothing for it and ask in your reply. End your reply with a rounds table."
